name: Extrair projecto Flutter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Extrair projecto
        run: |
          unzip -o MOZ_LIVROS_R_fase9_testes.zip -d .
          rm MOZ_LIVROS_R_fase9_testes.zip

      - name: Guardar ficheiros
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extrair projecto Flutter" || echo "Sem alterações"
          git push
          # Workflow de extracção do projecto
